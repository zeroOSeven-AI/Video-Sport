
name: Update YouTube Channel IDs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update YouTube channel IDs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request

          API_KEY = os.environ["YOUTUBE_API_KEY"]
          BASE = "https://www.googleapis.com/youtube/v3"

          def api(endpoint, params):
              params["key"] = API_KEY
              url = BASE + "/" + endpoint + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read())

          handles = {
              "Formula 1": "@formula1",
              "Premier League": "@premierleague",
              "Bundesliga": "@bundesliga",
              "LaLiga": "@laliga",
              "Serie A": "@seriea",
              "Ligue 1": "@ligue1",
              "Liga Portugal": "@sportdigital_primeiraliga",
              "Eredivisie": "@sportdigital_eredivisie",
              "HNL": "@max-sport",
              "UEFA": "@uefa"
          }

          found = {}

          for name, handle in handles.items():
              data = api("channels", {
                  "part": "id,snippet",
                  "forHandle": handle
              })

              items = data.get("items", [])

              if not items:
                  raise RuntimeError(
                      f"Kanal nije pronađen: {name} ({handle})"
                  )

              channel = items[0]
              found[name] = channel["id"]

              print(
                  f"[OK] {name}: "
                  f"{channel['snippet']['title']} "
                  f"| {channel['id']}"
              )

          # Süper Lig: dohvat kanala iz dostavljenog videa
          video_data = api("videos", {
              "part": "snippet",
              "id": "L9FZyM2bvhY"
          })

          videos = video_data.get("items", [])

          if not videos:
              raise RuntimeError(
                  "Süper Lig video nije pronađen."
              )

          video_snippet = videos[0]["snippet"]
          found["Süper Lig"] = video_snippet["channelId"]

          print(
              f"[OK] Süper Lig: "
              f"{video_snippet['channelTitle']} "
              f"| {found['Süper Lig']}"
          )

          # Football konfiguracija
          football_path = "Football/config.json"

          with open(football_path, encoding="utf-8") as f:
              football = json.load(f)

          source_map = [
              ("Premier League", "Premier League Official"),
              ("Bundesliga", "Bundesliga Official"),
              ("LaLiga", "LaLiga Official"),
              ("Serie A", "Serie A Official"),
              ("Ligue 1", "Ligue 1 Official"),
              ("Liga Portugal", "Liga Portugal"),
              ("Eredivisie", "Eredivisie"),
              ("Süper Lig", "Süper Lig"),
              ("HNL", "SuperSport HNL"),
              ("Champions League", "UEFA Official"),
              ("Europa League", "UEFA Europa League"),
              ("Conference League", "UEFA Conference League")
          ]

          sources = []

          for league, name in source_map:
              channel_key = (
                  "UEFA" if league in (
                      "Champions League",
                      "Europa League",
                      "Conference League"
                  ) else league
              )

              sources.append({
                  "name": name,
                  "league_name": league,
                  "channel_id": found[channel_key],
                  "enabled": True
              })

          football["youtube_sources"] = sources

          with open(football_path, "w", encoding="utf-8") as f:
              json.dump(
                  football,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
              f.write("\n")

          # F1 konfiguracija - ostale postavke ostaju netaknute
          f1_path = "F1/config.json"

          with open(f1_path, encoding="utf-8") as f:
              f1 = json.load(f)

          f1["youtube_sources"] = [{
              "name": "Formula 1 Official",
              "channel_id": found["Formula 1"],
              "enabled": True
          }]

          with open(f1_path, "w", encoding="utf-8") as f:
              json.dump(
                  f1,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
              f.write("\n")

          print("\nObje konfiguracije uspješno ažurirane.")
          PY

      - name: Commit updated configurations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Football/config.json F1/config.json
          if git diff --cached --quiet; then
            echo "Nema promjena."
          else
            git commit -m "Update YouTube channel IDs"
            git push
          fi
